name: Terraform Azure Deployment

on:
  push:
    branches:
      - main
      - 'feature/**'
      - feature
      - features
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================================
  # STAGE 1: Terraform Format, Init, Validate, and Plan
  # ============================================================================
  terraform-plan:
    name: "Stage 1: Terraform Plan (Validation & Preview)"
    runs-on: [self-hosted, macOS]

    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail "{0}"
        working-directory: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Environment & Tools
        run: |
          echo "===================================="
          echo " Stage 1: Runner & Tool Info"
          echo "===================================="
          echo "User: $(whoami)"
          echo "OS: $(uname -a)"
          echo "Working Dir: $(pwd)"
          terraform version
          if command -v az &> /dev/null; then
            az version --output table
          fi

      - name: Terraform Format Check
        run: |
          echo "===================================="
          echo " Terraform Format Check"
          echo "===================================="
          terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          echo "===================================="
          echo " Terraform Init"
          echo "===================================="
          terraform init -input=false

      - name: Terraform Validate
        run: |
          echo "===================================="
          echo " Terraform Validate"
          echo "===================================="
          terraform validate

      - name: Security Scan (Checkov)
        run: |
          echo "===================================="
          echo " Security Scan with Checkov"
          echo "===================================="
          if command -v checkov &> /dev/null; then
            checkov -d . --framework terraform --soft-fail
          elif [ -f "$HOME/.local/bin/checkov" ]; then
            $HOME/.local/bin/checkov -d . --framework terraform --soft-fail
          else
            echo "Checkov security scanner not found, skipping..."
          fi

      - name: Terraform Plan
        run: |
          echo "===================================="
          echo " Terraform Plan"
          echo "===================================="
          terraform plan -no-color

  # ============================================================================
  # STAGE 2: Create Open Pull Request for Manual Review
  # ============================================================================
  create-pr:
    name: "Stage 2: Open Pull Request for Review"
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: [self-hosted, macOS]

    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail "{0}"
        working-directory: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Automatic Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          base: main
          title: "Automated PR: Merge ${{ github.ref_name }} into main"
          body: |
            ## 🚀 Stage 2: Pull Request for Manual Review
            `Stage 1 (Terraform Plan)` succeeded on `${{ github.ref_name }}`.

            ### 📋 Action Required by Reviewer:
            1. Review the Terraform Plan output above.
            2. Approve & Click **Merge pull request** to trigger **Stage 3 (Terraform Apply)** on `main`.

      - name: PR Notice for User
        run: |
          echo "=================================================================="
          echo " ✅ Stage 1 (Terraform Plan) Passed!"
          echo " 📌 Stage 2: Pull Request is open for branch '${{ github.ref_name }}'."
          echo " 🛑 MANUAL APPROVAL REQUIRED: Please review and click MERGE on GitHub."
          echo " 🚀 Stage 3 (Terraform Apply) will run automatically after merge."
          echo "=================================================================="

  # ============================================================================
  # STAGE 3: Terraform Apply (Runs ONLY after Manual PR Merge to Main)
  # ============================================================================
  terraform-apply:
    name: "Stage 3: Terraform Apply (Main Branch Post-Merge)"
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]

    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail "{0}"
        working-directory: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Terraform Init
        run: |
          echo "===================================="
          echo " Stage 3: Terraform Init (Main)"
          echo "===================================="
          terraform init -input=false

      - name: Terraform Apply
        run: |
          echo "===================================="
          echo " Stage 3: Terraform Apply (Main)"
          echo "===================================="
          terraform apply -input=false -auto-approve
