name: Terraform Azure Deployment

on:
  push:
    branches:
      - main
      - 'feature/**'
      - feature
      - features
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================================
  # STAGE 1 & 2: Terraform Plan, Validate, and Open Pull Request
  # ============================================================================
  terraform-plan-and-pr:
    name: "Stage 1 & 2: Terraform Plan & Create PR"
    runs-on: [self-hosted, macOS]

    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail "{0}"
        working-directory: .

    steps:
      - name: Checkout Repository (Native Git)
        run: |
          echo "===================================="
          echo " Checkout Repository (Native Git)"
          echo "===================================="
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

      - name: Check Environment & Tools
        run: |
          echo "===================================="
          echo " Stage 1: Runner & Tool Info"
          echo "===================================="
          echo "User: $(whoami)"
          echo "OS: $(uname -a)"
          echo "Working Dir: $(pwd)"
          terraform version
          if command -v az &> /dev/null; then
            az version --output table
          fi

      - name: Terraform Format Check
        run: |
          echo "===================================="
          echo " Terraform Format Check"
          echo "===================================="
          terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          echo "===================================="
          echo " Terraform Init"
          echo "===================================="
          terraform init -input=false

      - name: Terraform Validate
        run: |
          echo "===================================="
          echo " Terraform Validate"
          echo "===================================="
          terraform validate

      - name: Security Scan (Checkov)
        run: |
          echo "===================================="
          echo " Security Scan with Checkov"
          echo "===================================="
          if command -v checkov &> /dev/null; then
            checkov -d . --framework terraform --soft-fail
          elif [ -f "$HOME/.local/bin/checkov" ]; then
            $HOME/.local/bin/checkov -d . --framework terraform --soft-fail
          else
            echo "Checkov security scanner not found, skipping..."
          fi

      - name: Terraform Plan
        run: |
          echo "===================================="
          echo " Terraform Plan"
          echo "===================================="
          terraform plan -no-color

      - name: Create Automatic Pull Request
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          echo "===================================="
          echo " Stage 2: Create Pull Request via GitHub API"
          echo "===================================="
          PR_PAYLOAD=$(cat <<EOF
          {
            "title": "Automated PR: Merge ${BRANCH_NAME} into main",
            "head": "${BRANCH_NAME}",
            "base": "main",
            "body": "## 🚀 Stage 2: Pull Request for Manual Review\n\`Stage 1 (Terraform Plan)\` succeeded on \`${BRANCH_NAME}\`.\n\n### 📋 Action Required by Reviewer:\n1. Review the Terraform Plan output above.\n2. Approve & Click **Merge pull request** to trigger **Stage 3 (Terraform Apply)** on \`main\`."
          }
          EOF
          )
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${REPO_NAME}/pulls \
            -d "${PR_PAYLOAD}")
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_STATUS" -eq 201 ]; then
            echo " ✅ Pull Request successfully created!"
          elif [ "$HTTP_STATUS" -eq 422 ]; then
            echo " ℹ️ Pull Request already open for branch '${BRANCH_NAME}'."
          else
            echo " ⚠️ API returned status ${HTTP_STATUS}: ${BODY}"
          fi

      - name: PR Notice for User
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          echo "=================================================================="
          echo " ✅ Stage 1 (Terraform Plan) Passed!"
          echo " 📌 Stage 2: Pull Request is open for branch '${{ github.ref_name }}'."
          echo " 🛑 MANUAL APPROVAL REQUIRED: Please review and click MERGE on GitHub."
          echo " 🚀 Stage 3 (Terraform Apply) will run automatically after merge."
          echo "=================================================================="

  # ============================================================================
  # STAGE 3: Terraform Apply (Runs ONLY after Manual PR Merge to Main)
  # ============================================================================
  terraform-apply:
    name: "Stage 3: Terraform Apply (Main Branch Post-Merge)"
    needs: terraform-plan-and-pr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]

    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail "{0}"
        working-directory: .

    steps:
      - name: Checkout Repository (Native Git)
        run: |
          echo "===================================="
          echo " Checkout Repository (Native Git)"
          echo "===================================="
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

      - name: Terraform Init
        run: |
          echo "===================================="
          echo " Stage 3: Terraform Init (Main)"
          echo "===================================="
          terraform init -input=false

      - name: Terraform Apply
        run: |
          echo "===================================="
          echo " Stage 3: Terraform Apply (Main)"
          echo "===================================="
          terraform apply -input=false -auto-approve
