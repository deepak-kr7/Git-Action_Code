name: Terraform Azure Deployment

on:
  push:
    branches:
      - main
      - 'feature/**'
      - feature
      - features
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform CI/CD Workflow
    runs-on: [self-hosted, macOS]

    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail "{0}"
        working-directory: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Environment & Tools
        run: |
          echo "===================================="
          echo " Runner & macOS Environment Info"
          echo "===================================="
          echo "User: $(whoami)"
          echo "OS: $(uname -a)"
          echo "Working Dir: $(pwd)"
          echo ""
          echo "===================================="
          echo " Tool Versions"
          echo "===================================="
          terraform version
          echo ""
          if command -v az &> /dev/null; then
            az version --output table
          else
            echo "Azure CLI not found in PATH"
          fi

      - name: Terraform Format Check
        run: |
          echo "===================================="
          echo " Terraform Format Check"
          echo "===================================="
          terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          echo "===================================="
          echo " Terraform Init"
          echo "===================================="
          terraform init -input=false

      - name: Terraform Validate
        run: |
          echo "===================================="
          echo " Terraform Validate"
          echo "===================================="
          terraform validate

      - name: Security Scan (Checkov)
        run: |
          echo "===================================="
          echo " Security Scan with Checkov"
          echo "===================================="
          if command -v checkov &> /dev/null; then
            checkov -d . --framework terraform --soft-fail
          elif [ -f "$HOME/.local/bin/checkov" ]; then
            $HOME/.local/bin/checkov -d . --framework terraform --soft-fail
          else
            echo "Checkov security scanner not found, skipping..."
          fi

      - name: Terraform Plan
        run: |
          echo "===================================="
          echo " Terraform Plan"
          echo "===================================="
          terraform plan -no-color

      - name: PR Merge Instructions Notice
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          echo "=================================================================="
          echo " ✅ Terraform Plan completed successfully on branch: ${{ github.ref_name }}"
          echo " 📌 Next Step: Open a Pull Request (PR) from '${{ github.ref_name }}' into 'main'."
          echo " 🚀 Merge PR to trigger 'Terraform Apply' automatically on main."
          echo "=================================================================="

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "===================================="
          echo " Terraform Apply (Main Branch Only)"
          echo "===================================="
          terraform apply -input=false -auto-approve
